  var DICT = { fr: FR, ar: AR };
  var STORE_KEY = "crf-medea-lang";
  var WA_NUMBER = "213555976200";
  var currentLang = "fr";

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function getLang() {
    var stored;
    try { stored = localStorage.getItem(STORE_KEY); } catch (e) { stored = null; }
    if (stored === "fr" || stored === "ar") return stored;
    var nav = (navigator.language || "fr").toLowerCase();
    return nav.indexOf("ar") === 0 ? "ar" : "fr";
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem(STORE_KEY, lang); } catch (e) {}
    render(lang);
  }

  function render(lang) {
    var t = DICT[lang];
    var rtl = lang === "ar";

    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? "rtl" : "ltr";

    // simple text / html bindings
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (!(key in t)) return;
      var suffix = el.getAttribute("data-i18n-suffix") || "";
      el.textContent = t[key] + suffix;
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-html");
      if (key in t) el.innerHTML = t[key];
    });

    document.title = t.pageTitle;

    // nav
    document.getElementById("siteNav").innerHTML = t.nav.map(function (item) {
      return '<a href="' + item.href + '">' + esc(item.label) + "</a>";
    }).join("");

    // highlights
    document.getElementById("highlights").innerHTML = t.highlights.map(function (h) {
      return '<div class="hl-card"><span class="hl-num">' + esc(h.n) + "</span><h3>" +
        esc(h.title) + "</h3><p>" + esc(h.desc) + "</p></div>";
    }).join("");

    // about paragraphs
    document.getElementById("aboutParas").innerHTML = t.aboutParas.map(function (p) {
      return '<p class="about-para">' + esc(p) + "</p>";
    }).join("");

    // credentials
    document.getElementById("credentials").innerHTML = t.credentials.map(function (c) {
      return '<div class="cred"><h3>' + esc(c.title) + "</h3><p>" + esc(c.desc) + "</p></div>";
    }).join("");

    // services
    document.getElementById("services").innerHTML = t.services.map(function (s) {
      return '<div class="svc"><h3>' + esc(s.name) + "</h3>" +
        '<div><p class="svc-label treats">' + esc(t.servTreatsLabel) + '</p><p class="body">' + esc(s.treats) + "</p></div>" +
        '<div><p class="svc-label expect">' + esc(t.servExpectLabel) + '</p><p class="body muted">' + esc(s.expect) + "</p></div>" +
        "</div>";
    }).join("");

    // steps
    document.getElementById("steps").innerHTML = t.steps.map(function (s) {
      return '<div class="step"><p class="step-num">' + esc(s.n) + "</p><h3>" +
        esc(s.title) + "</h3><p>" + esc(s.desc) + "</p></div>";
    }).join("");

    // practical facts + payment
    var facts = t.practical.map(function (p) {
      return '<div class="fact"><p class="fact-label">' + esc(p.label) +
        '</p><p class="fact-value">' + esc(p.value) + "</p></div>";
    }).join("");
    if (t.payText && t.payText.trim()) {
      facts += '<div class="fact pay"><p class="fact-label">' + esc(t.payLabel) +
        '</p><p class="fact-value">' + esc(t.payText) + "</p></div>";
    }
    document.getElementById("practical").innerHTML = facts;

    // faq
    document.getElementById("faq").innerHTML = t.faqs.map(function (f) {
      return '<div class="faq-item"><h3>' + esc(f.q) + "</h3><p>" + esc(f.a) + "</p></div>";
    }).join("");
  }

  function initForm() {
    var form = document.getElementById("waForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = DICT[currentLang];
      var data = new FormData(form);
      var lines = [
        t.waName + (data.get("name") || ""),
        t.waPhone + (data.get("phone") || ""),
        "",
        data.get("msg") || ""
      ];
      var url = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));
      window.open(url, "_blank", "noopener");
    });
  }

  function init() {
    currentLang = getLang();
    render(currentLang);
    initForm();
    document.getElementById("langToggle").addEventListener("click", function () {
      setLang(currentLang === "ar" ? "fr" : "ar");
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
